<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Offline ChatGPT</title>
<style>

  
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}
body{background:#212121;color:#fff;height:100vh}
.app{display:flex;height:100vh}
.sidebar{width:300px;background:#0f0f0f;border-right:1px solid #2a2a2a;padding:15px}
.logo{font-size:22px;font-weight:bold;margin-bottom:30px}
.sideBtn{padding:13px;border-radius:10px;margin:8px 0;cursor:pointer}
.sideBtn:hover,.active{background:#2f2f2f}
.main{flex:1;display:flex;flex-direction:column;position:relative}
.top{height:60px;display:flex;align-items:center;padding:0 25px;font-size:20px;font-weight:bold}
.chat{flex:1;overflow-y:auto;padding:40px 20px 150px}
.empty{text-align:center;margin-top:120px;font-size:32px;font-weight:bold}

button{
  display:flex;
  align-items:center;
  justify-content:center;
}

.trainBtn svg{
  width:22px;
  height:22px;
}

#sendBtn svg{
  width:22px;
  height:22px;
}

button svg{
  width:22px;
  height:22px;
}

#sendBtn{
  transition:.2s;
}

.stopIcon{
  width:14px;
  height:14px;
  background:black;
  border-radius:3px;
}

.msg{max-width:820px;margin:18px auto;line-height:1.6;font-size:16px;display:flex}
.user{justify-content:flex-end}
.bot{justify-content:flex-start}
.text{max-width:75%;padding:14px 18px;border-radius:18px;white-space:pre-wrap}
.user .text{background:#2f2f2f;border-bottom-right-radius:4px}
.bot .text{background:transparent}

pre{background:#0d0d0d;border:1px solid #333;border-radius:14px;padding:14px;overflow:auto;margin-top:10px;color:#e5e5e5}
code{font-family:Consolas,monospace;font-size:14px}

.inputWrap{position:fixed;bottom:0;left:300px;right:0;background:linear-gradient(transparent,#212121 35%);padding:45px 20px 22px}
.inputBox{max-width:820px;margin:auto;background:#303030;border:1px solid #555;border-radius:28px;padding:12px;display:flex;align-items:end;gap:8px}
textarea{flex:1;background:transparent;border:0;outline:0;color:white;font-size:16px;resize:none;height:48px;padding:12px}
button{width:42px;height:42px;border:0;border-radius:50%;background:white;color:black;font-size:22px;cursor:pointer}
.trainBtn{background:#10a37f;color:white;font-size:18px}
.dots span{animation:blink 1.4s infinite}
.dots span:nth-child(2){animation-delay:.2s}
.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

.modal{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;z-index:99}
.modalBox{width:420px;background:#2f2f2f;border:1px solid #555;border-radius:18px;padding:20px}
.modalBox h2{margin-bottom:15px}
.modalBox input,.modalBox textarea{width:100%;background:#1f1f1f;border:1px solid #555;color:white;border-radius:10px;padding:12px;margin:8px 0;outline:none}
.modalBox textarea{height:100px}
.row{display:flex;gap:10px;margin-top:10px}
.row button{width:auto;padding:10px 18px;border-radius:10px;font-size:15px}
.save{background:#10a37f;color:white}
.cancel{background:#555;color:white}
@media(max-width:800px){.sidebar{display:none}.inputWrap{left:0}}

@media(max-width:900px){
  .sidebar{display:none}
  .top{height:56px;padding:0 16px;font-size:18px}
  .chat{padding:25px 12px 130px}
  .msg{max-width:100%;font-size:15px}
  .text{max-width:88%;padding:12px 14px}
  .inputWrap{left:0;padding:35px 10px 14px}
  .inputBox{max-width:100%;border-radius:22px}
}

@media(max-width:600px){
  body{height:100dvh}
  .app{height:100dvh}
  .top{font-size:17px}
  .empty{font-size:24px;margin-top:90px}
  .chat{padding:18px 10px 120px}
  .msg{margin:12px auto}
  .text{max-width:92%;font-size:15px;border-radius:15px}
  textarea{font-size:15px;height:44px;padding:10px}
  button{width:38px;height:38px;font-size:20px}
  .inputBox{padding:8px;gap:6px}
  .modal{padding:12px}
  .modalBox{
    width:100%;
    max-width:420px;
    border-radius:16px;
    padding:18px;
  }
  .modalBox h2{font-size:26px}
  .modalBox input,
  .modalBox textarea{
    font-size:15px;
    padding:12px;
  }
  .row{flex-wrap:wrap}
  .row button{
    flex:1;
    min-width:130px;
    height:48px;
  }
}

@media(max-width:380px){
  .empty{font-size:21px}
  .text{max-width:95%;font-size:14px}
  .modalBox h2{font-size:23px}
}
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="logo">ChatGPT</div>
    <div class="sideBtn active" onclick="location.reload()">✎ New chat</div>
    <div class="sideBtn">🔍 Search chats</div>
    <div class="sideBtn">📁 Projects</div>
    <div class="sideBtn">📚 Library</div>
    <div class="sideBtn" onclick="openTrain()">➕ Train Bot</div>
  </div>

  <div class="main">
    <div class="top">Online ChatGPT</div>
    <div class="chat" id="chat">
      <div class="empty" id="empty">What can I help with?</div>
    </div>
  </div>
</div>

<div class="inputWrap">
  <div class="inputBox">

  <button class="trainBtn" onclick="openTrain()">
    <svg viewBox="0 0 24 24" fill="none">
      <path d="M12 5V19M5 12H19"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"/>
    </svg>
  </button>

  <textarea id="text"
  placeholder="Message Offline ChatGPT"
  onkeydown="keySend(event)"></textarea>

  <button id="sendBtn" onclick="sendMsg()">

    <svg id="sendIcon" viewBox="0 0 24 24" fill="none">
      <path d="M12 5L12 19"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"/>

      <path d="M6 11L12 5L18 11"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"/>
    </svg>

  </button>

</div>
</div>

<div class="modal" id="trainModal">
  <div class="modalBox">
    <h2>Train Bot</h2>
    <input id="trainQ" placeholder="User kya bolega?">
    <textarea id="trainA" placeholder="Bot kya reply karega?"></textarea>
    <div class="row">
      <button class="save" onclick="saveTrain()">Save Training</button>
      <button class="cancel" onclick="closeTrain()">Cancel</button>
    </div>
  </div>
</div>

<script>
function escapeHtml(str){
  return str.replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}




function addMsg(text,type){
  document.getElementById("empty")?.remove();
  const chat=document.getElementById("chat");
  const box=document.createElement("div");
  box.className="msg "+type;
  box.innerHTML=`<div class="text"></div>`;
  chat.appendChild(box);
  const t=box.querySelector(".text");

  if(type==="bot"){
    let i=0;
    const timer=setInterval(()=>{
      t.innerHTML=formatReply(text.substring(0,i++));
      chat.scrollTop=chat.scrollHeight;
      if(i>text.length)clearInterval(timer);
    },20);
  }else{
    t.innerText=text;
  }
  chat.scrollTop=chat.scrollHeight;
}

function typing(){
  const chat=document.getElementById("chat");
  const box=document.createElement("div");
  box.className="msg bot";
  box.id="typing";
  box.innerHTML=`<div class="text dots"><span>.</span><span>.</span><span>.</span></div>`;
  chat.appendChild(box);
  chat.scrollTop=chat.scrollHeight;
}

let loading=false;

async function sendMsg(){

  if(loading)return;

  const input=document.getElementById("text");
  const message=input.value.trim();

  if(!message)return;

  loading=true;

  const sendBtn=document.getElementById("sendBtn");

  sendBtn.innerHTML=`<div class="stopIcon"></div>`;

  addMsg(message,"user");

  input.value="";

  typing();

  try{

    const res=await fetch("/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message:message
      })
    });

    const data=await res.json();

    document.getElementById("typing")?.remove();

    addMsg(data.reply,"bot");

  }catch(err){

    document.getElementById("typing")?.remove();

    addMsg("Error aa gaya bhai 😅","bot");

  }

  sendBtn.innerHTML=`
  <svg id="sendIcon" viewBox="0 0 24 24" fill="none">
    <path d="M12 5L12 19"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"/>

    <path d="M6 11L12 5L18 11"
    stroke="currentColor"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>
  </svg>
  `;

  loading=false;
}

function openTrain(){
  document.getElementById("trainModal").style.display="flex";
}

function closeTrain(){
  document.getElementById("trainModal").style.display="none";
}

async function saveTrain(){
  const q=document.getElementById("trainQ").value.trim();
  const a=document.getElementById("trainA").value.trim();

  if(!q || !a){
    alert("Question aur answer dono भरो babu");
    return;
  }

  const res=await fetch("/train",{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({question:q,answer:a})
  });

  const data=await res.json();
  alert(data.msg);

  document.getElementById("trainQ").value="";
  document.getElementById("trainA").value="";
  closeTrain();
}

function keySend(e){
  if(e.key === "Enter" && !e.shiftKey){
    e.preventDefault();
    sendMsg();
  }
}


function formatReply(text){
  const t = text.toLowerCase();

  if(
    t.includes("answer:") ||
    t.includes("integration") ||
    t.includes("derivative") ||
    t.includes("factor") ||
    t.includes("expand")
  ){
    return "<pre style='color:#00ff99'>" + escapeHtml(text) + "</pre>";
  }

  if(
    t.includes("<!doctype html>") ||
    t.includes("def ") ||
    t.includes("import ")
  ){
    return "<pre><code>" + escapeHtml(text) + "</code></pre>";
  }

  return escapeHtml(text);
}
</script>

</body>
</html>
